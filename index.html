<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyReminder</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyReminder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<form class="auth" id="auth" hidden>
  <h1>MyReminder</h1>
  <p class="auth-hint" id="authHint">Sign in to see your tasks on every device.</p>
  <input id="aUser" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <input id="aPass" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit" class="save" id="aSubmit">Sign in</button>
  <p class="auth-error" id="aError" role="alert"></p>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <p class="date" id="date"></p>
      <h1>Today</h1>
    </div>
    <p class="count" id="count"></p>
  </header>

  <button class="notice" id="notifyBtn" type="button" hidden>Turn on notifications to get reminders</button>
  <p class="notice warn" id="syncMsg" hidden></p>

  <form class="add" id="addForm" autocomplete="off">
    <input id="addTitle" type="text" placeholder="Topic" maxlength="140" aria-label="Topic">
    <textarea id="addNote" rows="1" placeholder="Description (optional)" maxlength="2000" aria-label="Description"></textarea>
    <div class="add-row">
      <input id="addTime" type="time" aria-label="Reminder time">
      <button type="button" id="addRepeat" class="chip" aria-pressed="false">Daily</button>
      <button type="submit" class="add-btn" aria-label="Add task">+</button>
    </div>
  </form>

  <ul id="list" class="list"></ul>
  <p class="empty" id="empty" hidden>Nothing for today. Add a task above.</p>

  <details id="otherWrap" hidden>
    <summary>Other days <span id="otherCount"></span></summary>
    <ul id="other" class="list"></ul>
  </details>

  <p class="account"><span id="who"></span> · <button type="button" class="link" id="signOut">Sign out</button></p>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="editForm" autocomplete="off">
    <input id="eTitle" type="text" required maxlength="140" placeholder="Topic" aria-label="Topic">
    <textarea id="eNote" rows="3" maxlength="2000" placeholder="Description" aria-label="Description"></textarea>
    <label>Time <input id="eTime" type="time"></label>
    <label>Repeat
      <select id="eRepeat">
        <option value="once">Never</option>
        <option value="daily">Every day</option>
        <option value="weekdays">Weekdays</option>
        <option value="days">Chosen days</option>
      </select>
    </label>
    <div class="days" id="eDays" hidden></div>
    <label id="eDateWrap">Date <input id="eDate" type="date"></label>
    <div class="sheet-actions">
      <button type="button" class="link danger" id="eDelete">Delete</button>
      <span></span>
      <button type="button" class="link" id="eCancel">Cancel</button>
      <button type="submit" class="save">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="alert" hidden>
  <p id="tTitle"></p>
  <div>
    <button type="button" id="tDone">Done</button>
    <button type="button" id="tSnooze">10 min</button>
    <button type="button" id="tClose" aria-label="Dismiss">✕</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
